name: CI
on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  library:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      # Hostile web settings: the library must ignore them.
      PHX_SERVER: 'true'
      PORT: 'not-a-port'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.6.11
          install: false
      - run: mise trust && mise install
      - run: mise exec -- mix local.hex --force && mise exec -- mix local.rebar --force && mise exec -- mix deps.get
      - run: mise run check
      - run: mise run check:reference
      - name: Isolated immutable Git consumer
        env:
          # PR github.sha is a synthetic merge commit, absent from normal Git fetches.
          OPSMARU_INCUS_FIXTURE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          OPSMARU_INCUS_FIXTURE_REPOSITORY: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
        run: python3 scripts/check-consumer.py
