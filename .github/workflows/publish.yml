name: Publish
# Publishes the Hex package and its docs when a release tag is pushed, then
# creates the tag's GitHub Release with the tama-dex cassette attached.
# Pushing a v* tag is the publish decision; it needs user authorization
# (AGENTS.md).
#
# Hex stages releases and docs published with an API key until an owner
# approves them. `mix hex.publish` succeeds while a release is still staged, so
# this workflow reads the release's real state: it uploads only what is
# missing, shows the approval URL, and waits up to an hour for the package and
# docs to go live. Approve the staged release and the run continues by itself.
# If the wait runs out, approve and rerun the failed run. A rerun never uploads
# a staged release again, and the GitHub Release and cassette are created only
# once the package is live.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  hex:
    runs-on: ubuntu-24.04
    # Leaves room for the hour-long wait for the Hex approval.
    timeout-minutes: 90
    # Holds HEX_API_KEY; add required reviewers to this environment to gate publishing.
    environment: hex
    permissions:
      # Create the GitHub Release and upload the cassette.
      contents: write
      # Sign the cassette's build provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Tag matches the package version and is on main
        id: version
        run: |
          version=$(sed -nE 's/^  @version "([^"]+)"$/\1/p' mix.exs)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mix.exs version ${version}" >&2
            exit 1
          fi
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "Tag ${GITHUB_REF_NAME} is not on main" >&2
            exit 1
          }
          # The release notes come from this version's dated CHANGELOG.md section.
          heading=$(grep -m1 -E "^## ${version//./\\.}( |$)" CHANGELOG.md || true)
          if [ -z "${heading}" ]; then
            echo "CHANGELOG.md has no ${version} section" >&2
            exit 1
          fi
          case "${heading}" in
            *nreleased*)
              echo "CHANGELOG.md still marks ${version} as unreleased" >&2
              exit 1
              ;;
          esac
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.6.11
          install: false
      - run: mise trust && mise install
      - run: mise exec -- mix local.hex --force && mise exec -- mix local.rebar --force && mise exec -- mix deps.get
      - run: mise exec -- mix hex.build
      # The package and its docs are uploaded separately. Each is live,
      # approved but not served yet, staged for an owner's approval, or
      # missing. Only a missing one is uploaded, so a rerun never uploads twice.
      - name: Check for the Hex release
        id: hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/hex-release-state.sh "${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Publish package
        if: steps.hex.outputs.package == 'missing'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mise exec -- mix hex.publish package --yes
      # Docs uploaded beside a staged package are approved with it, and Hex
      # does not report them until the package is live. So a rerun leaves
      # them alone while the package is still waiting for approval.
      - name: Publish docs
        if: >-
          steps.hex.outputs.docs == 'missing' &&
          steps.hex.outputs.package != 'staged' &&
          steps.hex.outputs.package != 'approved'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mise exec -- mix hex.publish docs --yes
      # Nothing below runs until Hex serves the package and its docs. This
      # waits for the owner's approval instead of failing straight away.
      - name: Wait for the Hex release to go live
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/wait-for-hex-release.sh "${VERSION}"
      # A release that already carries the cassette keeps it: the published
      # SHA-256 is what hosts pin, so a rerun never replaces it.
      - name: Check for the GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cassette="opsmaru_incus-${VERSION}.tama-cassette"
          assets="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' 2>/dev/null || true)"

          if grep -qxF "${cassette}" <<< "${assets}" && grep -qxF "${cassette}.sha256" <<< "${assets}"; then
            echo "GitHub Release ${GITHUB_REF_NAME} already has ${cassette}."
            echo "complete=true" >> "${GITHUB_OUTPUT}"
          else
            echo "complete=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "cassette=${cassette}" >> "${GITHUB_OUTPUT}"
      # Derived data built from the two operation documents the package ships.
      # It is published beside the package, never inside it.
      - name: Build and verify the cassette
        if: steps.release.outputs.complete != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: mise exec -- .github/scripts/build-cassette.sh "${VERSION}" dist
      - name: Attest the cassette's build provenance
        if: steps.release.outputs.complete != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ steps.release.outputs.cassette }}
      - name: Create the GitHub Release with the cassette
        if: steps.release.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          CASSETTE: ${{ steps.release.outputs.cassette }}
        run: |
          awk -v version="${VERSION}" '
            /^## / { found = ($2 == version); next }
            found { print }
          ' CHANGELOG.md > dist/notes.md

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # The release exists without its assets: an earlier run stopped here.
            gh release upload "${GITHUB_REF_NAME}" "dist/${CASSETTE}" "dist/${CASSETTE}.sha256" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file dist/notes.md \
              "dist/${CASSETTE}" "dist/${CASSETTE}.sha256"
          fi

          cat "dist/${CASSETTE}.sha256" >> "${GITHUB_STEP_SUMMARY}"
